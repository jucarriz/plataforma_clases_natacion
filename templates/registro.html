{% extends 'base.html' %}
{% block title %}Registro{% endblock %}

{% block contenido %}
<div class="caja">
    <h2>Registro</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Crear cuenta</button>
    </form>

    <div style="margin-top:15px;">
        <a href="{% url 'login' %}">Volver al inicio de sesión</a>
    </div>
</div>
{% endblock %}
