{% extends 'base.html' %}
{% block title %}Iniciar sesión{% endblock %}

{% block contenido %}
<div class="caja">
    <h2>Iniciar sesión</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Entrar</button>
    </form>

    <div style="margin-top:15px;">
        <a href="{% url 'password_reset' %}">¿Olvidaste tu contraseña?</a>
    </div>
</div>
{% endblock %}
