{% extends 'base.html' %}


{% block title %}Recuperar contraseña{% endblock %}

{% block contenido %}
<div class="caja">
    <h2>Recuperar contraseña</h2>

    <p>Ingresá tu correo electrónico y te enviaremos un enlace para crear una nueva contraseña.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Enviar correo</button>
    </form>

    <div class="enlace">
        <a href="{% url 'login' %}">Volver al inicio de sesión</a>
    </div>
</div>
{% endblock %}
